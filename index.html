<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Brushing Teeth — Practice</title>
<style>
  :root{
    --sky:#74AADB; --navy:#1D2D54; --blue:#1A64CC; --orange:#F05500;
    --green:#0F9B52; --purple:#7E1AAA; --bg:#e9f2fb; --panel:#ffffff;
    --ink:#22314f; --muted:#7d8aa3; --line:#d7e2f0;
    --shadow:0 6px 18px rgba(29,45,84,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:linear-gradient(160deg,#eaf3fb 0%,#dcebf9 100%); color:var(--ink);
    overflow:hidden; user-select:none; -webkit-user-select:none;
    padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
  }
  #app{height:100%; display:flex; flex-direction:column;}

  /* ---------- top bar ---------- */
  .bar{display:flex; align-items:center; gap:.6rem; padding:clamp(.5rem,1.4vw,1rem) clamp(.7rem,2vw,1.4rem);}
  .bar .title{font-weight:800; color:var(--navy); font-size:clamp(1.1rem,2.6vw,1.7rem); letter-spacing:.2px;}
  .bar .spacer{flex:1;}
  .iconbtn{
    border:none; background:var(--panel); color:var(--navy); box-shadow:var(--shadow);
    border-radius:999px; width:clamp(2.6rem,5vw,3.2rem); height:clamp(2.6rem,5vw,3.2rem);
    font-size:clamp(1.1rem,2.4vw,1.5rem); cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:transform .08s;
  }
  .iconbtn:active{transform:scale(.92);}
  .stars{font-size:clamp(1.2rem,2.6vw,1.7rem); color:#f2b705; letter-spacing:2px; min-width:2ch;}
  .progresstxt{font-weight:700; color:var(--muted); font-size:clamp(.9rem,2vw,1.2rem);}

  /* ---------- screens ---------- */
  .screen{flex:1; min-height:0; display:none; flex-direction:column; padding:0 clamp(.7rem,2.2vw,1.6rem) clamp(.7rem,2vw,1.4rem);}
  .screen.on{display:flex;}

  /* ---------- home ---------- */
  #home{align-items:center; justify-content:center; text-align:center; gap:clamp(1rem,3vh,2rem);}
  #home h1{color:var(--navy); font-size:clamp(2rem,6vw,3.6rem); margin:.2rem 0 0; font-weight:800;}
  #home .sub{color:var(--muted); font-size:clamp(1rem,2.6vw,1.5rem); margin-top:-.3rem;}
  .tiles{display:flex; gap:clamp(1rem,3vw,2rem); flex-wrap:wrap; justify-content:center; width:100%;}
  .tile{
    background:var(--panel); border-radius:26px; box-shadow:var(--shadow); cursor:pointer;
    width:clamp(230px,34vw,360px); padding:clamp(1.2rem,3vw,2rem); border:3px solid transparent;
    transition:transform .1s, border-color .1s; display:flex; flex-direction:column; align-items:center; gap:.7rem;
  }
  .tile:active{transform:translateY(3px) scale(.99);}
  .tile .emoji{font-size:clamp(3rem,7vw,4.6rem); line-height:1;}
  .tile .name{font-weight:800; color:var(--navy); font-size:clamp(1.3rem,3vw,1.9rem);}
  .tile .desc{color:var(--muted); font-size:clamp(.9rem,2vw,1.15rem);}
  .tile.order{border-color:var(--blue);}
  .tile.match{border-color:var(--orange);}
  .segwrap{display:flex; flex-direction:column; align-items:center; gap:.5rem;}
  .segwrap .lab{color:var(--muted); font-weight:700; font-size:clamp(.85rem,1.9vw,1.05rem);}
  .seg{display:inline-flex; background:#dbe7f5; border-radius:999px; padding:.3rem;}
  .seg button{
    border:none; background:transparent; color:var(--navy); font-weight:700; cursor:pointer;
    padding:.55rem 1.1rem; border-radius:999px; font-size:clamp(.9rem,2vw,1.15rem); transition:background .1s;
  }
  .seg button.sel{background:var(--panel); box-shadow:0 2px 6px rgba(29,45,84,.15);}

  /* ---------- instruction ---------- */
  .instr{text-align:center; font-weight:800; color:var(--navy); font-size:clamp(1.1rem,2.8vw,1.7rem); margin:.2rem 0 .6rem;}

  /* ---------- sequence rail ---------- */
  .rail{display:flex; flex-wrap:wrap; gap:clamp(.4rem,1.2vw,.8rem); justify-content:center; margin-bottom:clamp(.5rem,1.6vh,1rem);}
  .slot{
    width:clamp(74px,10vw,120px); height:clamp(74px,10vw,120px); border-radius:16px;
    background:#dbe7f5; border:2px dashed #b6c8e0; display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .slot .num{font-weight:800; color:#9db4d4; font-size:clamp(1.4rem,3vw,2.1rem);}
  .slot.filled{border-style:solid; border-color:var(--green); background:var(--panel);}
  .slot img{width:100%; height:100%; object-fit:cover;}
  .slot .tick{position:absolute; right:3px; bottom:3px; background:var(--green); color:#fff;
    border-radius:999px; width:1.5rem; height:1.5rem; display:flex; align-items:center; justify-content:center; font-size:1rem;}

  /* ---------- card tray ---------- */
  .tray{
    flex:1; min-height:0; overflow:auto; display:grid; align-content:start;
    grid-template-columns:repeat(auto-fit,minmax(clamp(140px,20vw,210px),1fr));
    gap:clamp(.6rem,1.6vw,1.1rem); padding:.3rem;
  }
  .card{
    background:var(--panel); border-radius:18px; box-shadow:var(--shadow); cursor:pointer;
    overflow:hidden; border:3px solid transparent; transition:transform .08s, border-color .1s, opacity .2s;
    display:flex; flex-direction:column;
  }
  .card:active{transform:scale(.97);}
  .card .pic{width:100%; aspect-ratio:1/.82; background:#f2f6fc; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .card .pic img{width:100%; height:100%; object-fit:contain;}
  .card .cap{padding:.5rem .4rem; text-align:center; font-weight:700; color:var(--ink);
    font-size:clamp(.9rem,1.9vw,1.15rem); line-height:1.15;}
  .card.hint{border-color:var(--orange); animation:pulse 1s ease-in-out infinite;}
  .card.wrong{animation:shake .4s;}
  .card.gone{opacity:0; pointer-events:none; transform:scale(.6);}

  /* ---------- match ---------- */
  #match .promptpic{
    background:var(--panel); border-radius:22px; box-shadow:var(--shadow); margin:0 auto clamp(.6rem,2vh,1rem);
    width:clamp(200px,32vh,340px); height:clamp(180px,30vh,320px); display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #match .promptpic img{width:100%; height:100%; object-fit:contain; padding:.4rem;}
  .choices{display:grid; gap:clamp(.6rem,1.6vh,1rem); grid-template-columns:1fr; max-width:640px; width:100%; margin:0 auto;}
  .choice{
    border:none; background:var(--panel); box-shadow:var(--shadow); cursor:pointer; border-radius:16px;
    padding:clamp(.9rem,2.2vh,1.4rem); font-weight:800; color:var(--navy); font-size:clamp(1.1rem,2.6vw,1.6rem);
    border:3px solid transparent; transition:transform .08s;
  }
  .choice:active{transform:scale(.98);}
  .choice.right{border-color:var(--green); background:#e7f7ee;}
  .choice.wrong{border-color:#e0b4b4; background:#fbeeee; animation:shake .4s;}

  /* ---------- done overlay ---------- */
  #done{position:absolute; inset:0; background:rgba(233,242,251,.94); display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; gap:1rem; z-index:20;}
  #done.on{display:flex;}
  #done .big{font-size:clamp(2rem,7vw,3.6rem); font-weight:800; color:var(--navy);}
  #done .starrow{font-size:clamp(2.4rem,8vw,4rem); color:#f2b705; letter-spacing:6px;}
  #done .msg{color:var(--muted); font-size:clamp(1.1rem,2.6vw,1.5rem);}
  #done .row{display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;}
  .bigbtn{border:none; border-radius:999px; padding:clamp(.8rem,2vh,1.1rem) clamp(1.6rem,4vw,2.4rem);
    font-weight:800; font-size:clamp(1.1rem,2.6vw,1.5rem); cursor:pointer; box-shadow:var(--shadow); color:#fff;}
  .bigbtn.primary{background:var(--green);}
  .bigbtn.ghost{background:var(--panel); color:var(--navy);}

  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

  .confetti{position:fixed; top:-20px; width:12px; height:12px; z-index:30; pointer-events:none; border-radius:2px;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg); opacity:.9}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button class="iconbtn" id="homeBtn" title="Home" style="display:none">&#8962;</button>
    <div class="title" id="barTitle">Brushing Teeth</div>
    <div class="spacer"></div>
    <div class="progresstxt" id="progress"></div>
    <div class="stars" id="stars"></div>
    <button class="iconbtn" id="soundBtn" title="Sound">&#128266;</button>
  </div>

  <!-- HOME -->
  <section class="screen on" id="home">
    <h1>Brushing Teeth</h1>
    <div class="sub">Let&#39;s practice the steps</div>
    <div class="tiles">
      <div class="tile order" data-go="sequence">
        <div class="emoji">&#128290;</div>
        <div class="name">Put It In Order</div>
        <div class="desc">Build the steps 1, 2, 3&hellip;</div>
      </div>
      <div class="tile match" data-go="match">
        <div class="emoji">&#129513;</div>
        <div class="name">Match the Steps</div>
        <div class="desc">Find the words that match</div>
      </div>
    </div>
    <div class="segwrap">
      <div class="lab">How many steps?</div>
      <div class="seg" id="scopeSeg">
        <button data-scope="brush">Brushing (4)</button>
        <button data-scope="all" class="sel">Whole routine (9)</button>
      </div>
    </div>
  </section>

  <!-- SEQUENCE -->
  <section class="screen" id="sequence">
    <div class="instr" id="seqInstr">Tap the pictures in order. What comes first?</div>
    <div class="rail" id="rail"></div>
    <div class="tray" id="tray"></div>
  </section>

  <!-- MATCH -->
  <section class="screen" id="match">
    <div class="instr" id="matchInstr">Which step is this? Tap the words that match.</div>
    <div class="promptpic" id="promptpic"></div>
    <div class="choices" id="choices"></div>
  </section>

  <!-- DONE -->
  <div id="done">
    <div class="big" id="doneBig">All done!</div>
    <div class="starrow" id="doneStars">&#9733;&#9733;&#9733;</div>
    <div class="msg" id="doneMsg"></div>
    <div class="row">
      <button class="bigbtn primary" id="againBtn">Go again</button>
      <button class="bigbtn ghost" id="menuBtn">Menu</button>
    </div>
  </div>
</div>

const state = { screen:"home", scope:"all", sound:true };

/* ---------- sound ---------- */
let AC=null;
function tone(freqs, dur=0.14, type="sine", when=0){
  if(!state.sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type; o.frequency.value=f;
      const t=AC.currentTime+when+i*dur;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}
const good = ()=>tone([660,880],0.13,"sine");
const win  = ()=>tone([660,880,1046,1318],0.16,"triangle");
const nope = ()=>tone([200],0.18,"sine");

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function activeSteps(){ return state.scope==="brush" ? STEPS.slice(2,6) : STEPS; }
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("#"+id).classList.add("on");
  state.screen=id;
  $("#homeBtn").style.display = id==="home" ? "none" : "flex";
  $("#stars").textContent=""; $("#progress").textContent="";
  $("#barTitle").textContent = id==="sequence" ? "Put It In Order" : id==="match" ? "Match the Steps" : "Brushing Teeth";
}
function starStr(n){return "\u2605".repeat(n);}
function confetti(){
  const cols=["#F05500","#1A64CC","#0F9B52","#7E1AAA","#f2b705","#74AADB"];
  for(let i=0;i<36;i++){
    const d=document.createElement("div"); d.className="confetti";
    d.style.left=Math.random()*100+"vw"; d.style.background=cols[i%cols.length];
    d.style.animation="fall "+(1.6+Math.random()*1.4)+"s linear "+(Math.random()*0.5)+"s forwards";
    document.body.appendChild(d); setTimeout(()=>d.remove(),3600);
  }
}

/* ---------- SEQUENCE ---------- */
let seq={order:[],placed:0,wrong:0};
function startSequence(){
  show("sequence");
  const steps=activeSteps();
  seq={order:steps, placed:0, wrong:0, tray:shuffle(steps)};
  renderSeq();
}
function renderSeq(){
  const rail=$("#rail"); rail.innerHTML="";
  seq.order.forEach((st,i)=>{
    const slot=document.createElement("div"); slot.className="slot";
    if(i<seq.placed){ slot.classList.add("filled");
      slot.innerHTML='<img src="'+st.img+'"><div class="tick">&#10003;</div>';
    } else {
      slot.innerHTML='<span class="num">'+(i+1)+'</span>';
    }
    rail.appendChild(slot);
  });
  const tray=$("#tray"); tray.innerHTML="";
  seq.tray.forEach(st=>{
    const placed = seq.order.indexOf(st) < seq.placed;
    const c=document.createElement("div"); c.className="card"+(placed?" gone":"");
    c.innerHTML='<div class="pic"><img src="'+st.img+'"></div><div class="cap">'+st.short+'</div>';
    if(!placed) c.onclick=()=>tapSeq(st,c);
    tray.appendChild(c);
  });
  $("#progress").textContent = seq.placed+" / "+seq.order.length;
  $("#seqInstr").textContent = seq.placed===0 ? "Tap the pictures in order. What comes first?" : "Nice! What comes next?";
}
function tapSeq(st,card){
  const need=seq.order[seq.placed];
  if(st===need){
    seq.placed++; seq.wrong=0; good();
    card.classList.add("gone");
    setTimeout(()=>{ renderSeq(); if(seq.placed===seq.order.length) finish("sequence"); }, 180);
  } else {
    seq.wrong++; nope();
    card.classList.remove("wrong"); void card.offsetWidth; card.classList.add("wrong");
    if(seq.wrong>=2){ // gentle hint
      [...document.querySelectorAll(".card")].forEach(el=>el.classList.remove("hint"));
      const cards=[...document.querySelectorAll("#tray .card")];
      const idx=seq.tray.indexOf(need);
      if(cards[idx]) cards[idx].classList.add("hint");
    }
  }
}

/* ---------- MATCH ---------- */
let mt={queue:[],idx:0,score:0};
function startMatch(){
  show("match");
  mt={queue:shuffle(activeSteps()), idx:0, score:0};
  renderMatch();
}
function renderMatch(){
  const st=mt.queue[mt.idx];
  $("#promptpic").innerHTML='<img src="'+st.img+'">';
  const pool=shuffle(STEPS.filter(s=>s!==st)).slice(0,2);
  const opts=shuffle([st,...pool]);
  const box=$("#choices"); box.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=o.short;
    b.onclick=()=>pickMatch(o,st,b);
    box.appendChild(b);
  });
  $("#progress").textContent=(mt.idx+1)+" / "+mt.queue.length;
  $("#stars").textContent=starStr(Math.min(3,Math.round(mt.score/mt.queue.length*3)));
}
function pickMatch(o,st,btn){
  if(o===st){
    btn.classList.add("right"); mt.score++; good();
    [...document.querySelectorAll(".choice")].forEach(b=>b.onclick=null);
    setTimeout(()=>{ mt.idx++; if(mt.idx>=mt.queue.length) finish("match"); else renderMatch(); }, 550);
  } else {
    nope(); btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
  }
}

/* ---------- finish ---------- */
function finish(kind){
  win(); confetti();
  const n = kind==="sequence" ? seq.order.length : mt.queue.length;
  $("#doneBig").textContent = "All done!";
  $("#doneStars").innerHTML = "\u2605\u2605\u2605";
  $("#doneMsg").textContent = kind==="sequence"
     ? "You put all "+n+" steps in order."
     : "You matched "+mt.score+" of "+n+" steps.";
  $("#done").classList.add("on");
  $("#againBtn").onclick=()=>{ $("#done").classList.remove("on"); kind==="sequence"?startSequence():startMatch(); };
  $("#menuBtn").onclick=()=>{ $("#done").classList.remove("on"); show("home"); };
}

/* ---------- wire up ---------- */
document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
  if(AC && AC.state==="suspended") AC.resume();
  t.dataset.go==="sequence"?startSequence():startMatch();
});
$("#scopeSeg").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  state.scope=b.dataset.scope;
  $("#scopeSeg").querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b));
});
$("#homeBtn").onclick=()=>{ $("#done").classList.remove("on"); show("home"); };
$("#soundBtn").onclick=()=>{
  state.sound=!state.sound;
  $("#soundBtn").innerHTML = state.sound ? "&#128266;" : "&#128263;";
  if(state.sound){ AC=AC||null; good(); }
};
</script>
</body>
</html>
